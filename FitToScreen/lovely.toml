[manifest]
version = "1.1.0"
dump_lua = true
priority = 0

# Fit To Screen
# Balatro fits the game to the window using the room height plus a top and bottom padding
# (ROOM_PADDING_H, 0.7 tiles in the base game). With many mods adding rows to the pause menu
# and the left sidebar, those columns grow taller than the room and get clipped at the top and bottom.
# A bigger padding makes the whole game scale down a little so tall UI fits.
# To tune it: raise the number for more margin (smaller game), lower it for a bigger game.
# 0.7 is the base game value. Restart the game after editing.
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.ROOM_PADDING_H= 0.7"
position = "at"
payload = "self.ROOM_PADDING_H = 1.3"
match_indent = true
