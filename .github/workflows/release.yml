name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version FitToScreen/metadata.json)
          ZIP="FitToScreen-v${VERSION}.zip"
          zip -r "$ZIP" FitToScreen
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ZIP" --clobber
          else
            gh release create "v${VERSION}" "$ZIP" --target "${GITHUB_SHA}" --title "Fit To Screen v${VERSION}" --notes-file "release-notes/v${VERSION}.md"
          fi
